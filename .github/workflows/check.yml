name: Tutorial checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        suite: [base, framework]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install base environment
        if: matrix.suite == 'base'
        run: python -m pip install -r requirements.txt
      - name: Install independent framework environment
        if: matrix.suite == 'framework'
        run: python -m pip install -r learning/frameworks/requirements.txt
      - run: python -m pip check
      - run: python -X utf8 -m scripts.check_docs
      - run: python -X utf8 -m scripts.verify_offline --suite ${{ matrix.suite }}
